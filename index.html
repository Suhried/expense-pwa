<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Expenses"/>
<meta name="theme-color" content="#000000"/>
<title>Expenses</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--bg2:#1C1C1E;--bg3:#2C2C2E;--bg4:#3A3A3C;
  --text:#fff;--text2:rgba(255,255,255,.55);--text3:rgba(255,255,255,.3);
  --sep:rgba(255,255,255,.1);--green:#30D158;--red:#FF453A;
  --sf:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --sat:env(safe-area-inset-top,44px);
  --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:#000;color:#fff;font-family:var(--sf);overflow:hidden}

/* ── APP SHELL ── */
#app{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:var(--sat) 1fr 72px;
  background:var(--bg);
  overflow:hidden;
}
#safe-top{background:var(--bg)}

/* ── SCREEN CONTAINER ── */
#screens{position:relative;overflow:hidden}

.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  background:var(--bg);
  transform:translateX(100%);
  transition:transform .35s cubic-bezier(.32,.72,0,1);
  pointer-events:none;
  overflow:hidden;
}
.screen.active{transform:translateX(0);pointer-events:all}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.scroll::-webkit-scrollbar{display:none}

/* ── TAB BAR ── */
#tab-bar{
  display:flex;align-items:flex-start;padding-top:8px;
  background:rgba(18,18,18,.95);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);
  padding-bottom:var(--sab);
}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:2px 0;border:none;background:none;color:var(--text2);font-family:var(--sf)}
.tab-item.active{color:#fff}
.tab-label{font-size:10px;font-weight:500}

/* ── TOP NAV ── */
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;flex-shrink:0}
.nav-pill{display:flex;align-items:center;gap:6px;background:var(--bg3);border-radius:20px;padding:8px 14px;font-size:16px;font-weight:600}
.nav-pill svg{opacity:.7}
.nav-btns{display:flex;gap:8px}
.nav-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}

/* ── HERO CARD ── */
.hero{background:var(--bg2);border-radius:20px;margin:0 16px 12px;padding:18px 18px 14px}
.hero-lbl{font-size:14px;color:var(--text2);margin-bottom:4px}
.hero-amt{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.05}
.hero-sym{font-size:28px;font-weight:500;vertical-align:super;letter-spacing:0}

/* ── BAR CHART ── */
.chart{margin-top:16px}
.bars{display:flex;align-items:flex-end;gap:5px;height:100px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar-fill{width:100%;border-radius:5px 5px 0 0;min-height:3px}
.bar-today{background:#fff}
.bar-other{background:rgba(255,255,255,.3)}
.days{display:flex;gap:5px;margin-top:5px}
.day-lbl{flex:1;text-align:center;font-size:11px;color:var(--text2)}

/* ── SECTION TITLE ── */
.sec-title{font-size:18px;font-weight:700;padding:8px 16px 6px}
.grp-title{font-size:14px;font-weight:600;color:var(--text2);padding:10px 16px 4px}

/* ── EXPENSE ROW ── */
.exp-row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg2);border-radius:14px;margin:0 16px 8px}
.exp-ico{width:40px;height:40px;border-radius:11px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.exp-info{flex:1;min-width:0}
.exp-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-sub{font-size:12px;color:var(--text2);margin-top:2px}
.exp-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.exp-amt{font-size:16px;font-weight:600}
.del-btn{width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,68,58,.2);color:#FF453A;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--sf)}

/* ── FAB — inside scroll, not fixed ── */
.fab-wrap{display:flex;justify-content:flex-end;padding:8px 20px 8px}
.fab{width:56px;height:56px;border-radius:50%;background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.fab svg{color:#000}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty p{font-size:15px}

/* ── SEARCH ── */
.search-wrap{margin:0 16px 10px;background:var(--bg2);border-radius:12px;display:flex;align-items:center;gap:8px;padding:10px 14px}
.search-wrap input{border:none;background:none;font-size:15px;font-family:var(--sf);color:#fff;flex:1;outline:none}
.search-wrap input::placeholder{color:var(--text2)}

/* ── FILTER PILLS ── */
.pills{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto}
.pills::-webkit-scrollbar{display:none}
.pill{border:none;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sf);background:var(--bg2);color:var(--text2);white-space:nowrap;flex-shrink:0}
.pill.active{background:#fff;color:#000}

/* ── ANALYTICS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.stat-box{background:var(--bg2);border-radius:14px;padding:14px}
.stat-lbl{font-size:12px;color:var(--text2);margin-bottom:5px}
.stat-val{font-size:20px;font-weight:700}
.a-card{background:var(--bg2);border-radius:14px;padding:14px;margin:0 16px 12px}
.a-card-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.leg-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--sep)}
.leg-row:last-child{border-bottom:none}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── SETTINGS ── */
.s-hdr{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:14px 16px 5px}
.s-group{background:var(--bg2);border-radius:14px;margin:0 16px 10px;overflow:hidden}
.s-row{display:flex;align-items:center;padding:13px 16px;border-bottom:.5px solid var(--sep);gap:10px}
.s-row:last-child{border-bottom:none}
.s-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.s-lbl{flex:1;font-size:16px}
.s-val{font-size:14px;color:var(--text2)}
.toggle{width:51px;height:31px;border-radius:16px;border:none;cursor:pointer;position:relative;transition:background .25s;flex-shrink:0}
.toggle::after{content:'';width:27px;height:27px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.toggle.on{background:var(--green)}.toggle.on::after{left:22px}
.toggle.off{background:#39393B}
.s-sel{border:none;background:none;font-size:14px;font-family:var(--sf);color:var(--text2);cursor:pointer;outline:none}
.s-sel option{background:var(--bg3)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:999;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.sheet{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding-bottom:calc(var(--sab) + 16px)}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.sheet-btn{background:var(--bg3);border:none;color:#fff;font-size:15px;font-family:var(--sf);padding:8px 16px;border-radius:20px;cursor:pointer}
.sheet-btn.bold{font-weight:600}
.sheet-title{font-size:17px;font-weight:600}
.fields{background:var(--bg3);border-radius:14px;margin:4px 16px 16px;overflow:hidden}
.field{display:flex;align-items:center;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.field:last-child{border-bottom:none}
.field-lbl{font-size:16px;width:80px;flex-shrink:0}
.field input{flex:1;border:none;background:none;font-size:16px;font-family:var(--sf);color:var(--text2);text-align:right;outline:none;min-width:0}
.field input::placeholder{color:var(--text3)}
.field input[type=number]{-moz-appearance:textfield}
.field input[type=number]::-webkit-outer-spin-button,
.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.field input[type=date]{color-scheme:dark;text-align:right}

/* ── TOAST ── */
.toast{
  position:fixed;top:calc(var(--sat) + 10px);left:50%;
  transform:translateX(-50%) translateY(-120px);
  background:rgba(40,40,40,.97);color:#fff;
  padding:10px 22px;border-radius:24px;font-size:14px;font-weight:500;
  z-index:9999;white-space:nowrap;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(10px);
}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="safe-top"></div>

  <div id="screens">

    <!-- DASHBOARD -->
    <div class="screen active" id="s0">
      <div class="top-nav">
        <div class="nav-pill">Expenses <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
        <div class="nav-btns">
          <button class="nav-btn" onclick="switchTab(1)"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
          <button class="nav-btn" onclick="switchTab(1)"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="10" y2="18"/></svg></button>
          <button class="nav-btn" onclick="switchTab(3)"><svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 018.5 12 3.5 3.5 0 0112 8.5a3.5 3.5 0 013.5 3.5 3.5 3.5 0 01-3.5 3.5M19.43 12.97c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/></svg></button>
        </div>
      </div>
      <div class="scroll">
        <div class="hero">
          <div class="hero-lbl">Spent this week</div>
          <div class="hero-amt"><span class="hero-sym" id="d-sym">$</span><span id="d-amt">0.00</span></div>
          <div class="chart">
            <div class="bars" id="d-bars"></div>
            <div class="days" id="d-days"></div>
          </div>
        </div>
        <div id="d-groups"></div>
        <div class="fab-wrap"><button class="fab" id="fab0" onclick="openAdd()"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
      </div>
    </div>

    <!-- EXPENSES -->
    <div class="screen" id="s1">
      <div class="top-nav">
        <div class="nav-pill">All Expenses</div>
        <div class="nav-btns"><button class="nav-btn" onclick="switchTab(0)"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button></div>
      </div>
      <div class="search-wrap">
        <svg width="15" height="15" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" placeholder="Search" oninput="onSearch(this.value)"/>
      </div>
      <div class="pills">
        <button class="pill active" onclick="setFilter('all',this)">All</button>
        <button class="pill" onclick="setFilter('week',this)">This Week</button>
        <button class="pill" onclick="setFilter('month',this)">This Month</button>
      </div>
      <div class="scroll">
        <div id="t-groups"></div>
        <div class="fab-wrap"><button class="fab" onclick="openAdd()"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
      </div>
    </div>

    <!-- ANALYTICS -->
    <div class="screen" id="s2">
      <div class="top-nav"><div class="nav-pill">Analytics</div></div>
      <div class="scroll">
        <div class="stat-grid" id="a-stats"></div>
        <div class="a-card">
          <div class="a-card-title">By Category</div>
          <div style="display:flex;justify-content:center;margin-bottom:14px"><canvas id="donut" width="150" height="150"></canvas></div>
          <div id="a-legend"></div>
        </div>
        <div class="a-card">
          <div class="a-card-title">Monthly Trend</div>
          <div style="display:flex;align-items:flex-end;gap:8px;height:90px" id="a-monthly"></div>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="screen" id="s3">
      <div class="top-nav"><div class="nav-pill">Settings</div></div>
      <div class="scroll">
        <div class="s-hdr">Preferences</div>
        <div class="s-group">
          <div class="s-row"><div class="s-ico" style="background:#1C3A5E">💱</div><div class="s-lbl">Currency</div><select class="s-sel" id="cur-sel"><option value="USD">🇺🇸 USD</option><option value="BDT">🇧🇩 BDT</option><option value="EUR">🇪🇺 EUR</option><option value="GBP">🇬🇧 GBP</option><option value="JPY">🇯🇵 JPY</option><option value="INR">🇮🇳 INR</option></select></div>
          <div class="s-row"><div class="s-ico" style="background:#3A2A00">🔔</div><div class="s-lbl">Notifications</div><button class="toggle off" id="tog-n"></button></div>
        </div>
        <div class="s-hdr">Data</div>
        <div class="s-group">
          <div class="s-row" onclick="exportCSV()" style="cursor:pointer"><div class="s-ico" style="background:#1C1C4E">📤</div><div class="s-lbl">Export CSV</div><svg width="7" height="12" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></div>
          <div class="s-row" onclick="clearAll()" style="cursor:pointer"><div class="s-ico" style="background:#3A0000">🗑️</div><div class="s-lbl" style="color:var(--red)">Clear All Data</div></div>
        </div>
        <div class="s-hdr">About</div>
        <div class="s-group">
          <div class="s-row"><div class="s-lbl">Version</div><div class="s-val">1.0.0</div></div>
          <div class="s-row"><div class="s-lbl">Offline</div><div class="s-val" style="color:var(--green)">✓ Ready</div></div>
        </div>
      </div>
    </div>

  </div><!-- end #screens -->

  <!-- TAB BAR -->
  <div id="tab-bar">
    <button class="tab-item active" data-tab="0">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><rect x="2" y="3" width="9" height="10" rx="2"/><rect x="13" y="3" width="9" height="6" rx="2"/><rect x="13" y="11" width="9" height="10" rx="2"/><rect x="2" y="15" width="9" height="6" rx="2"/></svg>
      <span class="tab-label">Dashboard</span>
    </button>
    <button class="tab-item" data-tab="1">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5" fill="currentColor"/><circle cx="3" cy="12" r="1.5" fill="currentColor"/><circle cx="3" cy="18" r="1.5" fill="currentColor"/></svg>
      <span class="tab-label">Expenses</span>
    </button>
    <button class="tab-item" data-tab="2">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span class="tab-label">Analytics</span>
    </button>
    <button class="tab-item" data-tab="3">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 018.5 12 3.5 3.5 0 0112 8.5a3.5 3.5 0 013.5 3.5 3.5 3.5 0 01-3.5 3.5M19.43 12.97c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/></svg>
      <span class="tab-label">Settings</span>
    </button>
  </div>

  <!-- ADD MODAL -->
  <div class="overlay" id="modal" onclick="if(event.target===this)closeAdd()">
    <div class="sheet">
      <div class="sheet-hdr">
        <button class="sheet-btn" onclick="closeAdd()">Cancel</button>
        <span class="sheet-title">New Expense</span>
        <button class="sheet-btn bold" onclick="saveExp()">Save</button>
      </div>
      <div class="fields">
        <div class="field"><span class="field-lbl">Title</span><input id="f-title" type="text" placeholder="e.g. Lunch" autocomplete="off"/></div>
        <div class="field"><span class="field-lbl">Amount</span><input id="f-amt" type="number" placeholder="0.00" step="0.01" min="0" inputmode="decimal"/></div>
        <div class="field"><span class="field-lbl">Date</span><input id="f-date" type="date" style="color-scheme:dark"/></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
