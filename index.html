<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Expenses"/>
<meta name="theme-color" content="#000000"/>
<title>Expenses</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;
  --bg2:#1C1C1E;
  --bg3:#2C2C2E;
  --bg4:#3A3A3C;
  --text:#fff;
  --text2:rgba(255,255,255,0.55);
  --text3:rgba(255,255,255,0.3);
  --sep:rgba(255,255,255,0.1);
  --blue:#007AFF;
  --green:#30D158;
  --red:#FF453A;
  --sf:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sf);
  overflow:hidden;
  /* Hide any native status bar duplication */
  padding-top:0;
}
#app{
  display:flex;
  flex-direction:column;
  height:100%;
  /* Use safe area for notch/island but NOT status bar — handled by apple-mobile-web-app-capable */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  max-width:430px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
}

/* ── SCREENS ── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);pointer-events:none;padding-top:env(safe-area-inset-top)}
.screen.active{transform:translateX(0);pointer-events:all}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.scroll::-webkit-scrollbar{display:none}

/* ── TOP NAV ── */
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px}
.nav-title-pill{display:flex;align-items:center;gap:6px;background:var(--bg3);border-radius:20px;padding:8px 14px;font-size:16px;font-weight:600;cursor:pointer}
.nav-title-pill svg{opacity:.7}
.nav-actions{display:flex;align-items:center;gap:8px}
.nav-icon-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}

/* ── TAB BAR ── */
.tab-bar{
  position:absolute;bottom:0;left:0;right:0;
  height:calc(56px + env(safe-area-inset-bottom));
  background:rgba(18,18,18,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);
  display:flex;align-items:flex-start;padding-top:8px;z-index:100;
}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:2px 0;border:none;background:none;color:var(--text2)}
.tab-item.active{color:var(--text)}
.tab-label{font-size:10px;font-weight:500}

/* ── HERO CARD ── */
.hero-card{background:var(--bg2);border-radius:20px;margin:4px 16px 16px;padding:20px}
.hero-label{font-size:14px;color:var(--text2);margin-bottom:6px}
.hero-amount{font-size:48px;font-weight:700;letter-spacing:-1px;line-height:1}
.hero-amount .sym{font-size:32px;font-weight:500;vertical-align:super;letter-spacing:0}

/* ── BAR CHART ── */
.chart-area{margin-top:20px;position:relative}
.chart-grid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.grid-line{border-top:.5px solid var(--sep);display:flex;justify-content:flex-end}
.grid-val{font-size:10px;color:var(--text2);padding:2px 0 0 6px;line-height:1}
.bars-row{display:flex;align-items:flex-end;gap:6px;height:160px;padding-bottom:22px;position:relative;z-index:1}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar-fill{width:100%;border-radius:6px 6px 0 0;min-height:3px;background:#fff;transition:height .5s cubic-bezier(.34,1.56,.64,1)}
.bar-fill.today{background:#fff}
.bar-fill.other{background:rgba(255,255,255,0.35)}
.bar-lbl{font-size:10px;color:var(--text2);position:absolute;bottom:0}
.days-row{display:flex;gap:6px;padding-top:4px}
.day-lbl{flex:1;text-align:center;font-size:11px;color:var(--text2)}

/* ── SECTION ── */
.section-title{font-size:18px;font-weight:700;padding:8px 20px 10px;color:var(--text)}
.day-group-title{font-size:15px;font-weight:600;padding:12px 20px 6px;color:var(--text2)}

/* ── EXPENSE ROW ── */
.exp-row{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--bg2);border-radius:16px;margin:0 16px 8px}
.exp-icon{width:42px;height:42px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.exp-icon svg{opacity:.8}
.exp-info{flex:1;min-width:0}
.exp-title{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-date{font-size:13px;color:var(--text2);margin-top:2px}
.exp-amount{font-size:18px;font-weight:600;flex-shrink:0}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:150;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.fab svg{color:#000}

/* ── MODAL SHEET ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;z-index:300;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex;animation:fadeIn .2s}
.modal-sheet{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{transform:translateY(100%)}}
.modal-sheet{animation:slideUp .32s cubic-bezier(.32,.72,0,1)}

/* Modal header */
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.modal-hdr-btn{background:var(--bg3);border:none;color:var(--text);font-size:15px;font-family:var(--sf);padding:8px 16px;border-radius:20px;cursor:pointer}
.modal-hdr-btn.save{background:var(--bg4);font-weight:500}
.modal-hdr-title{font-size:17px;font-weight:600}

/* Modal fields */
.modal-fields{background:var(--bg3);border-radius:16px;margin:8px 16px 16px;overflow:hidden}
.modal-field{display:flex;align-items:center;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.modal-field:last-child{border-bottom:none}
.modal-field-label{font-size:16px;color:var(--text);flex-shrink:0;width:80px}
.modal-field input,.modal-field select{flex:1;border:none;background:none;font-size:16px;font-family:var(--sf);color:var(--text2);text-align:right;outline:none;min-width:0}
.modal-field input::placeholder{color:var(--text3)}
.modal-field input[type="number"]{-moz-appearance:textfield}
.modal-field input[type="number"]::-webkit-outer-spin-button,
.modal-field input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}
.modal-field select option{background:var(--bg3);color:var(--text)}
.modal-field input[type="date"]{color-scheme:dark;text-align:right}

/* ── ANALYTICS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.stat-box{background:var(--bg2);border-radius:16px;padding:16px}
.stat-box-label{font-size:12px;color:var(--text2);margin-bottom:6px}
.stat-box-val{font-size:22px;font-weight:700}

/* Donut */
.donut-card{background:var(--bg2);border-radius:16px;padding:16px;margin:0 16px 12px}
.donut-card-title{font-size:14px;color:var(--text2);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;font-size:12px}
.legend-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--sep)}
.legend-row:last-child{border-bottom:none}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── SETTINGS ── */
.settings-group{background:var(--bg2);border-radius:16px;margin:0 16px 12px;overflow:hidden}
.settings-hdr{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:16px 16px 6px}
.settings-row{display:flex;align-items:center;padding:14px 16px;border-bottom:.5px solid var(--sep);gap:12px}
.settings-row:last-child{border-bottom:none}
.settings-row-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.settings-row-label{flex:1;font-size:16px}
.settings-row-val{font-size:15px;color:var(--text2)}
.toggle{width:51px;height:31px;border-radius:16px;border:none;cursor:pointer;position:relative;transition:background .25s;flex-shrink:0}
.toggle::after{content:'';width:27px;height:27px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.toggle.on{background:var(--green)}.toggle.on::after{left:22px}
.toggle.off{background:#39393B}
select.inline-sel{border:none;background:none;font-size:15px;font-family:var(--sf);color:var(--text2);cursor:pointer;outline:none}
select.inline-sel option{background:var(--bg3)}

/* ── TOAST ── */
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(50,50,50,.96);color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;font-weight:500;z-index:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;backdrop-filter:blur(10px)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:44px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">

  <!-- ════════════════════════════════════════
       SCREEN 0 — DASHBOARD
  ════════════════════════════════════════ -->
  <div class="screen active" id="screen-0">
    <div class="scroll">
      <!-- Top nav -->
      <div class="top-nav">
        <div class="nav-title-pill">
          Expenses
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="nav-actions">
          <button class="nav-icon-btn" onclick="switchTab(1)">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          </button>
          <button class="nav-icon-btn" onclick="switchTab(1)">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="10" y2="18"/></svg>
          </button>
          <button class="nav-icon-btn" onclick="switchTab(3)">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 018.5 12 3.5 3.5 0 0112 8.5a3.5 3.5 0 013.5 3.5 3.5 3.5 0 01-3.5 3.5M19.43 12.97c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/></svg>
          </button>
        </div>
      </div>

      <!-- Hero -->
      <div class="hero-card">
        <div class="hero-label">Spent this week</div>
        <div class="hero-amount" id="hero-week"><span class="sym" id="hero-sym">$</span><span id="hero-val">0.00</span></div>
        <div class="chart-area">
          <div class="chart-grid" id="chart-grid"></div>
          <div class="bars-row" id="bars-row"></div>
          <div class="days-row" id="days-row"></div>
        </div>
      </div>

      <!-- Latest transactions -->
      <div id="dash-groups"></div>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       SCREEN 1 — ALL TRANSACTIONS
  ════════════════════════════════════════ -->
  <div class="screen" id="screen-1">
    <div class="scroll">
      <div class="top-nav">
        <div class="nav-title-pill">
          All Expenses
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="nav-actions">
          <button class="nav-icon-btn" onclick="switchTab(0)">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          </button>
        </div>
      </div>
      <!-- Search -->
      <div style="margin:0 16px 12px;background:var(--bg2);border-radius:12px;display:flex;align-items:center;gap:8px;padding:10px 14px;">
        <svg width="16" height="16" fill="none" stroke="var(--text2)" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" placeholder="Search" oninput="onSearch(this.value)" style="border:none;background:none;font-size:15px;font-family:var(--sf);color:var(--text);flex:1;outline:none;" />
      </div>
      <!-- Filter -->
      <div style="display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;">
        <button class="filter-pill active" onclick="setFilter('all',this)">All</button>
        <button class="filter-pill" onclick="setFilter('week',this)">This Week</button>
        <button class="filter-pill" onclick="setFilter('month',this)">This Month</button>
      </div>
      <style>
        .filter-pill{border:none;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--sf);background:var(--bg2);color:var(--text2);white-space:nowrap}
        .filter-pill.active{background:var(--text);color:var(--bg)}
      </style>
      <div id="txn-groups"></div>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       SCREEN 2 — ANALYTICS
  ════════════════════════════════════════ -->
  <div class="screen" id="screen-2">
    <div class="scroll">
      <div class="top-nav">
        <div class="nav-title-pill">Analytics</div>
      </div>
      <div class="stat-grid" id="stat-grid"></div>
      <div class="donut-card">
        <div class="donut-card-title">By Category</div>
        <div style="display:flex;justify-content:center;margin-bottom:16px"><canvas id="donut" width="160" height="160"></canvas></div>
        <div id="legend"></div>
      </div>
      <div class="donut-card">
        <div class="donut-card-title">Monthly Trend</div>
        <div style="display:flex;align-items:flex-end;gap:8px;height:100px" id="monthly-chart"></div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       SCREEN 3 — SETTINGS
  ════════════════════════════════════════ -->
  <div class="screen" id="screen-3">
    <div class="scroll">
      <div class="top-nav"><div class="nav-title-pill">Settings</div></div>
      <div class="settings-hdr">Preferences</div>
      <div class="settings-group">
        <div class="settings-row">
          <div class="settings-row-icon" style="background:#1C3A5E">💱</div>
          <div class="settings-row-label">Currency</div>
          <select class="inline-sel" id="currency-select">
            <option value="USD">🇺🇸 USD</option>
            <option value="BDT">🇧🇩 BDT</option>
            <option value="EUR">🇪🇺 EUR</option>
            <option value="GBP">🇬🇧 GBP</option>
            <option value="JPY">🇯🇵 JPY</option>
            <option value="INR">🇮🇳 INR</option>
          </select>
        </div>
        <div class="settings-row">
          <div class="settings-row-icon" style="background:#3A2A00">🔔</div>
          <div class="settings-row-label">Notifications</div>
          <button class="toggle off" id="t-notif"></button>
        </div>
      </div>
      <div class="settings-hdr">Data</div>
      <div class="settings-group">
        <div class="settings-row" onclick="exportCSV()" style="cursor:pointer">
          <div class="settings-row-icon" style="background:#1C1C4E">📤</div>
          <div class="settings-row-label">Export CSV</div>
          <svg width="8" height="14" fill="none" stroke="var(--text2)" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg>
        </div>
        <div class="settings-row" onclick="clearAllData()" style="cursor:pointer">
          <div class="settings-row-icon" style="background:#3A0000">🗑️</div>
          <div class="settings-row-label" style="color:var(--red)">Clear All Data</div>
        </div>
      </div>
      <div class="settings-hdr">About</div>
      <div class="settings-group">
        <div class="settings-row"><div class="settings-row-label">Version</div><div class="settings-row-val">1.0.0</div></div>
        <div class="settings-row"><div class="settings-row-label">Storage</div><div class="settings-row-val">On-device</div></div>
        <div class="settings-row"><div class="settings-row-label">Offline</div><div class="settings-row-val" style="color:var(--green)">✓ Ready</div></div>
      </div>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <button class="tab-item active" data-tab="0">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><rect x="2" y="3" width="9" height="10" rx="2"/><rect x="13" y="3" width="9" height="6" rx="2"/><rect x="13" y="11" width="9" height="10" rx="2"/><rect x="2" y="15" width="9" height="6" rx="2"/></svg>
      <span class="tab-label">Dashboard</span>
    </button>
    <button class="tab-item" data-tab="1">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5" fill="currentColor"/><circle cx="3" cy="12" r="1.5" fill="currentColor"/><circle cx="3" cy="18" r="1.5" fill="currentColor"/></svg>
      <span class="tab-label">Expenses</span>
    </button>
    <button class="tab-item" data-tab="2">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span class="tab-label">Analytics</span>
    </button>
    <button class="tab-item" data-tab="3">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 018.5 12 3.5 3.5 0 0112 8.5a3.5 3.5 0 013.5 3.5 3.5 3.5 0 01-3.5 3.5M19.43 12.97c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/></svg>
      <span class="tab-label">Settings</span>
    </button>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openAdd()">
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- ADD EXPENSE MODAL -->
  <div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeAdd()">
    <div class="modal-sheet">
      <div class="modal-hdr">
        <button class="modal-hdr-btn" onclick="closeAdd()">Cancel</button>
        <span class="modal-hdr-title">New Expense</span>
        <button class="modal-hdr-btn save" onclick="saveExpense()">Save</button>
      </div>
      <div class="modal-fields">
        <div class="modal-field">
          <span class="modal-field-label">Title</span>
          <input id="add-title" type="text" placeholder="e.g. Lunch" autocomplete="off"/>
        </div>
        <div class="modal-field">
          <span class="modal-field-label">Amount</span>
          <input id="add-amount" type="number" placeholder="0.00" step="0.01" min="0" inputmode="decimal"/>
        </div>
        <div class="modal-field">
          <span class="modal-field-label">Category</span>
          <select id="add-cat">
            <option>Food</option><option>Transport</option><option>Shopping</option>
            <option>Entertainment</option><option>Health</option><option>Utilities</option>
            <option>Education</option><option>Travel</option><option>Groceries</option>
            <option>Other</option>
          </select>
        </div>
        <div class="modal-field">
          <span class="modal-field-label">Date</span>
          <input id="add-date" type="date" style="color-scheme:dark"/>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
